[package]
name = "prodbox"
version = "0.1.0"
description = "Prod Box — desktop-first peer-to-peer audio collaboration hub"
authors = ["Prod Box Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prodbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs  = "2"
tauri-plugin-dialog          = "2"
tauri-plugin-shell           = "2"
tauri-plugin-persisted-scope = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

[profile.release]
panic   = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
